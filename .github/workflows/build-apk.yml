name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/, pubspec.yaml and README.md.
      # Generate the Android project files around them (existing files are kept).
      - name: Generate Android platform files
        run: |
          flutter create --org com.m9r1u5 --project-name wifi_password_guide --platforms android .
          rm -rf test
          # Nice app name under the icon instead of "wifi_password_guide"
          sed -i 's/android:label="[^"]*"/android:label="Wi-Fi Password Guide"/' android/app/src/main/AndroidManifest.xml
          # Fully offline app: strip the INTERNET permission that ML Kit's telemetry pulls in
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">\n    <uses-permission android:name="android.permission.INTERNET" tools:node="remove"/>|' android/app/src/main/AndroidManifest.xml
          head -5 android/app/src/main/AndroidManifest.xml
          # QR scanner needs Android 7.0+ (API 24)
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then sed -i -E 's/minSdk( = |Version )flutter\.minSdkVersion/minSdk\1 24/' "$f"; fi
          done
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WiFi-Password-Guide.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Password-Guide-apk
          path: WiFi-Password-Guide.apk

      - name: Publish GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Wi-Fi Password Guide v2.0.${{ github.run_number }}
          body: |
            Download **WiFi-Password-Guide.apk** below and open it on your Android phone to install.
            (Allow "Install unknown apps" for your browser if asked.)
          files: WiFi-Password-Guide.apk
          make_latest: true
