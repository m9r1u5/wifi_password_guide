name: wifi_password_guide
description: Phone-only app that reveals Wi-Fi passwords from Android "Share Wi-Fi" QR codes (screenshot or camera) and keeps them in a list.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.0
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  android_intent_plus: '>=5.0.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
